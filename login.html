<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System - Administrator Login</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            height: 100%;
            width: 100%;
        }
        .login-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f2744 0%, #1a365d 100%);
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .login-header {
            background: #0a1b30;
            color: #ffffff;
            padding: 32px 24px;
            text-align: center;
        }
        .login-logo {
            width: 58px;
            height: 58px;
            background: #2b6cb0;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .login-header h1 {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
        }
        .login-header p {
            font-size: 13px;
            color: #a0aec0;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .login-form-container {
            padding: 32px 28px;
            background-color: #ffffff;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }
        .form-group label .required {
            color: #e53e3e;
            margin-left: 3px;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            color: #2d3748;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:active {
            transform: scale(0.99);
        }
        .btn-primary {
            background-color: #1a365d;
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #2b6cb0;
        }
        .login-hint {
            background: #ebf8ff;
            border: 1px solid #bee3f8;
            color: #2b6cb0;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 20px;
            text-align: center;
            line-height: 1.5;
        }
        .login-hint code {
            background: rgba(43, 108, 176, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: Consolas, monospace;
            font-weight: bold;
            color: #1a365d;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        .alert-danger {
            background-color: #fff5f5;
            color: #c53030;
            border: 1px solid #feb2b2;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">&#128188;</div>
            <h1>Employee Management System</h1>
            <p>Administrator Portal</p>
        </div>
        
        <div class="login-form-container">
            {{ALERT_MESSAGE}}
            
            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Username <span class="required">*</span></label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter administrator username" required autofocus autocomplete="username">
                </div>
                
                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="password">Password <span class="required">*</span></label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter administrator password" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn btn-primary">
                    Sign In to Dashboard &rarr;
                </button>
            </form>
            
            <div class="login-hint">
                <strong>Administrator Credentials:</strong><br>
                Username: <code>sanman</code> &nbsp;|&nbsp; Password: <code>sanman123</code>
            </div>
        </div>
    </div>
</body>
</html>
